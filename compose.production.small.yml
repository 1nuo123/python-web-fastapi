      resources:
        limits:
          cpus: "0.50"
          memory: 256m
          pids: 128
        reservations:
          cpus: "0.10"
          memory: 128m

  app:
    cpus: "0.55"
    mem_limit: 320m
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "0.55"
          memory: 320m
          pids: 256
