x-small-resources: &small-resources
  cpus: "0.10"
  memory: 64m

services:
  postgres:
    cpus: "0.30"
    mem_limit: 160m
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 160m
          pids: 128
        reservations:
          cpus: "0.10"
          memory: 80m

  redis:
    cpus: "0.10"
    mem_limit: 64m
    pids_limit: 64
