[project]
name = "work"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "cachetools>=7.1.1",
    "cryptography>=50.0.0",
    "fastapi>=0.139.0",
    "funboost==54.8",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-sdk>=1.41.1",
    "orjson>=3.11.9",
    "passlib[bcrypt]>=1.7.4",
    "portalocker>=3.2.0",
    "prometheus-client>=0.25.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "pyyaml>=6.0.3",
    "redis>=7.4.0",
    "rtoml>=0.13.0",
    "sqlalchemy>=2.0.49",
    "sse-starlette>=3.3.2",
    "tuf>=6.0.0",
    "uvicorn[standard]>=0.47.0",
    "websockets>=16.0",
]

[tool.uv]
constraint-dependencies = [
    "cryptography>=50.0.0",
    "paramiko>=5.0.0",
    "pyasn1>=0.6.4",
    "setuptools>=83.0.0",
    "starlette>=1.3.1",
    "tornado>=6.5.7",
]
override-dependencies = [
    "fabric2>=3.2.3",
    "invoke>=2.0.0",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8.6",
    "defusedxml>=0.7.1",
    "detect-secrets>=1.5.0",
    "import-linter>=2.7",
    "locust>=2.40.4",
    "loguru>=0.7.3",
    "mypy>=1.17.1",
    "nox>=2025.5.1",
    "pip-audit>=2.9.0",
    "psutil>=7.2.2",
    "pyinstaller>=6.16.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.8",
    "types-passlib>=1.7.7.20250602",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
addopts = "--strict-markers"
markers = [
    "postgres: 需要真实 PostgreSQL 测试资源。",
    "redis: 需要真实 Redis 测试资源。",
    "rabbitmq: 需要真实 RabbitMQ 测试资源。",
    "docker: 需要 Docker 或 Compose 运行环境。",
    "public_network: 需要访问公网资源。",
    "integration: 需要一个或多个真实外部资源的集成测试。",
    "performance: 需要独占负载环境的性能测试。",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
follow_untyped_imports = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[tool.bandit]
exclude_dirs = ["test"]
skips = []

[tool.importlinter]
root_packages = ["src"]

[[tool.importlinter.contracts]]
name = "核心层禁止反向依赖"
type = "forbidden"
source_modules = ["src.core"]
forbidden_modules = ["src.api", "src.application", "src.domain", "src.infrastructure"]

[[tool.importlinter.contracts]]
name = "领域层禁止依赖外层"
type = "forbidden"
source_modules = ["src.domain"]
forbidden_modules = ["src.api", "src.application", "src.infrastructure"]

[[tool.importlinter.contracts]]
name = "应用层禁止依赖适配器"
type = "forbidden"
source_modules = ["src.application"]
forbidden_modules = ["src.api", "src.infrastructure"]

[[tool.importlinter.contracts]]
name = "基础设施禁止依赖 API"
type = "forbidden"
source_modules = ["src.infrastructure"]
forbidden_modules = ["src.api"]
