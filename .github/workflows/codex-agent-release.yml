name: Codex Agent Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Signed release version
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-sign:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-groups
      - run: uv run pyinstaller --clean --noconfirm packaging/windows/agent.spec
      - name: Sign Agent with managed certificate
        shell: pwsh
        env:
          AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
          AZURE_CERTIFICATE_NAME: ${{ secrets.AZURE_CERTIFICATE_NAME }}
        run: packaging/windows/scripts/sign_release.ps1 -InputPath dist/codex-remote-agent/codex-remote-agent.exe
      - name: Build per-user MSI
        shell: pwsh
        run: wix build packaging/windows/wix/Product.wxs -d AgentSource=dist/codex-remote-agent -o dist/CodexRemoteAgent.msi
      - name: Sign MSI with managed certificate
        shell: pwsh
        run: packaging/windows/scripts/sign_release.ps1 -InputPath dist/CodexRemoteAgent.msi
      - uses: actions/upload-artifact@v4
        with:
          name: codex-agent-${{ inputs.version }}
          path: dist/
