name: fastapi-web-caddy

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    ports:
      - '${CADDY_BIND_ADDRESS:-127.0.0.1}:${CADDY_HTTP_PORT:-8080}:80'
      - '${CADDY_BIND_ADDRESS:-127.0.0.1}:${CADDY_HTTPS_PORT:-8443}:443'
      - '${CADDY_BIND_ADDRESS:-127.0.0.1}:${CADDY_HTTPS_PORT:-8443}:443/udp'
    environment:
      CADDY_SITE_ADDRESS: '${CADDY_SITE_ADDRESS:-http://localhost}'
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      public: {}
      edge: {}

networks:
  public:
    driver: bridge
  edge:
    external: true
    name: ${EDGE_NETWORK_NAME:-fastapi-web-edge}

volumes:
  caddy_data:
  caddy_config:
