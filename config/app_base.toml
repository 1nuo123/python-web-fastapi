[app]
name = "fastapi-web-skeleton"
version = "2026.05.15"
environment = "development"
enable_openapi = true

[app.modules]
enabled = [
  "health_probe",
  "auth_access",
  "admin_identity",
  "admin_audit",
  "codex_control",
  "codex_agent_gateway",
]

[app.reload]
hot_reload_allowed = [
  "runtime.logging.level",
  "runtime.web.max_request_body_bytes",
  "runtime.stream.detail.send_timeout_seconds",
  "runtime.stream.detail.sse_heartbeat_seconds",
  "runtime.stream.detail.sse_retry_milliseconds",
  "modules.system.ready_probe_enabled",
  "modules.task.default_retry_limit",
]
