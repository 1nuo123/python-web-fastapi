[app]
name = "fastapi-web-skeleton"
version = "2026.05.15"
environment = "development"
enable_openapi = true

[app.modules]
enabled = [
  "health_probe",
  "auth_access",
  "admin_identity",
  "admin_audit",
]

[app.reload]
hot_reload_allowed = [
  "runtime.logging.level",
  "runtime.web.max_request_body_bytes",
  "modules.system.ready_probe_enabled",
  "modules.task.default_retry_limit",
]
restart_required = [
  "runtime.database.url",
  "runtime.database.schema",
  "runtime.database.pool_size",
  "runtime.database.max_overflow",
  "runtime.database.connect_timeout_seconds",
  "runtime.auth.jwt_secret",
  "runtime.auth.password_hash_algorithm",
  "runtime.auth.refresh_token_rotation_enabled",
  "runtime.cache.backend",
  "runtime.cache.default_ttl_seconds",
  "runtime.cache.key_prefix",
  "runtime.cache.backend_detail.kind",
  "runtime.cache.backend_detail.schema_version",
  "runtime.cache.backend_detail.max_entries",
  "runtime.cache.backend_detail.redis_url",
  "runtime.cache.backend_detail.socket_connect_timeout_seconds",
  "runtime.cache.namespace_policies",
  "runtime.cache.namespace_policies.header.kind",
  "runtime.cache.namespace_policies.header.schema_version",
  "runtime.cache.namespace_policies.header.detail_kind",
  "runtime.cache.namespace_policies.header.namespace",
  "runtime.cache.namespace_policies.detail.kind",
  "runtime.cache.namespace_policies.detail.schema_version",
  "runtime.cache.namespace_policies.detail.namespace",
  "runtime.cache.namespace_policies.detail.default_ttl_seconds",
  "runtime.cache.namespace_policies.detail.failure_mode",
  "runtime.distributed_lock",
  "runtime.distributed_lock.header.enabled",
  "runtime.distributed_lock.header.policy_name",
  "runtime.distributed_lock.detail.backend",
  "runtime.distributed_lock.detail.default_lease_seconds",
  "runtime.distributed_lock.detail.default_wait_seconds",
  "runtime.key_management",
  "runtime.key_management.header.enabled",
  "runtime.key_management.header.policy_name",
  "runtime.key_management.detail.backend",
  "runtime.key_management.detail.key_families",
  "runtime.security.detail.protection.flow_control.enabled",
  "runtime.security.detail.protection.flow_control.default_limit",
  "runtime.security.detail.protection.flow_control.default_window_seconds",
  "runtime.security.detail.protection.flow_control.fail_mode",
  "runtime.security.detail.protection.risk_control.enabled",
  "runtime.security.detail.protection.risk_control.password_spray_limit",
  "runtime.security.detail.protection.risk_control.password_spray_window_seconds",
  "runtime.security.detail.protection.ip_block.enabled",
  "runtime.security.detail.protection.ip_block.cache_ttl_seconds",
  "runtime.security.detail.protection.ip_block.default_block_seconds",
  "runtime.security.detail.protection.token_binding",
  "runtime.security.detail.protection.outbound_url_safety",
  "runtime.message.backend",
  "runtime.logging.enabled",
  "runtime.logging.sink",
  "runtime.logging.buffer_max_items",
  "runtime.logging.entry_project_name",
  "runtime.logging.entry_log_path",
  "runtime.logging.sink_detail.kind",
  "runtime.logging.sink_detail.schema_version",
  "runtime.logging.sink_detail.table_name",
  "runtime.logging.sink_detail.flush_interval_seconds",
  "runtime.logging.sink_detail.max_batch_size",
  "runtime.logging.sink_detail.fallback_to_stdout",
  "runtime.logging.sink_detail.retention_days",
  "runtime.web.request_execution",
  "runtime.web.request_execution.envelope_kind",
  "runtime.web.request_execution.schema_version",
  "runtime.web.request_execution.header.kind",
  "runtime.web.request_execution.header.schema_version",
  "runtime.web.request_execution.header.execution_name",
  "runtime.web.request_execution.header.enabled",
  "runtime.web.request_execution.header.mode",
  "runtime.web.request_execution.detail.kind",
  "runtime.web.request_execution.detail.schema_version",
  "runtime.web.request_execution.detail.offload_timeout_seconds",
  "runtime.web.request_execution.detail.propagate_cancellation",
  "runtime.web.outbound_http_client",
  "runtime.web.outbound_http_client.envelope_kind",
  "runtime.web.outbound_http_client.schema_version",
  "runtime.web.outbound_http_client.header.kind",
  "runtime.web.outbound_http_client.header.schema_version",
  "runtime.web.outbound_http_client.header.client_name",
  "runtime.web.outbound_http_client.header.enabled",
  "runtime.web.outbound_http_client.header.mode",
  "runtime.web.outbound_http_client.detail.kind",
  "runtime.web.outbound_http_client.detail.schema_version",
  "runtime.web.outbound_http_client.detail.timeout_seconds",
  "runtime.web.outbound_http_client.detail.max_connections",
  "runtime.web.outbound_http_client.detail.max_keepalive_connections",
  "runtime.web.cors.enabled",
  "runtime.web.cors.allow_origins",
  "runtime.web.cors.allow_methods",
  "runtime.web.cors.allow_headers",
  "runtime.web.cors.allow_credentials",
  "modules.auth.bootstrap_admin.enabled",
  "modules.auth.bootstrap_admin.username",
  "modules.auth.bootstrap_admin.subject_id",
  "modules.auth.bootstrap_admin.role_bindings",
  "modules.auth.bootstrap_admin.password_plain",
  "app.modules.enabled",
]
