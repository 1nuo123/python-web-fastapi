[runtime]
envelope_kind = "security_runtime_envelope"
schema_version = "1.0"

[runtime.header]
kind = "security_runtime_header"
schema_version = "1.0"
mode = "development_security"
enabled = true
policy_name = "development_default"

[runtime.detail]
kind = "development_security"
schema_version = "1.0"
expose_openapi = true
expose_system_info = false
require_external_jwt_secret = false
require_distributed_auth_throttle = false
enable_hsts = false
enable_csp = false

[runtime.detail.protection.flow_control]
enabled = true
default_limit = 120
default_window_seconds = 60
fail_mode = "fail_closed"

[[runtime.detail.protection.flow_control.policies]]
[runtime.detail.protection.flow_control.policies.header]
kind = "rate_limit_policy_header"
schema_version = "1.0"
detail_kind = "rate_limit_policy"
policy_name = "auth_token"
enabled = true

[runtime.detail.protection.flow_control.policies.detail]
kind = "rate_limit_policy"
schema_version = "1.0"
path = "/auth/token"
method = "POST"
limit = 10
window_seconds = 300
key_dimensions = ["ip_digest", "path_method"]
block_when_exceeded = true
block_seconds = 900

[[runtime.detail.protection.flow_control.policies]]
[runtime.detail.protection.flow_control.policies.header]
kind = "rate_limit_policy_header"
schema_version = "1.0"
detail_kind = "rate_limit_policy"
policy_name = "auth_refresh"
enabled = true

[runtime.detail.protection.flow_control.policies.detail]
kind = "rate_limit_policy"
schema_version = "1.0"
path = "/auth/refresh"
method = "POST"
limit = 20
window_seconds = 300
key_dimensions = ["ip_digest", "path_method"]
block_when_exceeded = true
block_seconds = 900

[runtime.detail.protection.risk_control]
enabled = true
password_spray_limit = 10
password_spray_window_seconds = 300

[runtime.detail.protection.client_ip]
trusted_proxy_cidr_blocks = ["127.0.0.0/8", "::1/128"]

[runtime.detail.protection.ip_block]
enabled = true
cache_ttl_seconds = 60
default_block_seconds = 900

[runtime.detail.protection.token_binding]
kind = "token_binding_policy"
schema_version = "1.0"
enabled = false
mode = "high_risk_only"
ip_digest_ttl_seconds = 900
applicable_paths = ["/auth/me"]
token_uses = ["access"]

[runtime.detail.protection.outbound_url_safety]
kind = "outbound_url_safety"
schema_version = "1.0"
enabled = true
allowed_schemes = ["http", "https"]
deny_private_networks = true
deny_metadata_address = true
deny_cidr_blocks = []
deny_hostnames = []
allowed_hostnames = []
enforce_allowed_hostnames = false
