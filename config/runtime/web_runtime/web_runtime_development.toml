[runtime.cors]
enabled = true
allow_origins = ["http://localhost:3000", "http://127.0.0.1:3000", "http://localhost:3310", "http://127.0.0.1:3310", "http://localhost:8080", "http://127.0.0.1:8080"]
allow_methods = ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
allow_headers = ["Authorization", "Content-Type", "Idempotency-Key", "X-Step-Up-Token"]
allow_credentials = true
